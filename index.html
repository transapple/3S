<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){var h=location.hash;if(/^#(content=|creator=|\/[^\/]+\/[^\/]+)/.test(h)){location.replace("https://transapple.github.io/Shalom-Stream/"+h)}})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Studio">
<script>(function(){var t=null;try{t=localStorage.getItem('ss-theme')}catch(_){}if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)})()</script>
<title>ShalomStream Studio — Creator dashboard</title>
<meta name="theme-color" content="#0c0f14">
<style>:root{
  --bg:#0c0f14; --surface:#131821; --surface2:#1a202b; --text:#eef1f5;
  --muted:#8e99a8; --line:#222a36; --line2:#2f3946; --gold:#d8a94e; --gold2:#ecc677;
  --danger:#e5645f; --r-sm:10px; --r-md:14px; --r-lg:20px;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{min-height:100vh}

/* Top bar */
.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 28px;position:sticky;top:0;z-index:30;background:rgba(12,15,20,.92);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:600;letter-spacing:-.01em;font-size:23px;white-space:nowrap;width:202px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center;color:#1a1305}
.brand span{color:var(--gold)}
.brand .brand-mark{color:#1a1305}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:42px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:0 18px 0 46px;outline:none;transition:border-color .15s,background .15s}
.search input::placeholder{color:#66717f}
.search input:focus{border-color:var(--gold);background:var(--surface2)}
.search-icon{position:absolute;left:16px;top:11px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.icon-btn,.outline-btn{background:transparent;color:var(--text);border:1px solid var(--line2);border-radius:var(--r-sm);height:40px;padding:0 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s}
.icon-btn{width:40px;padding:0}
.icon-btn:hover,.outline-btn:hover{background:var(--surface2);border-color:#465364}
.gold-btn{background:var(--gold);color:#1a1305;border:0;border-radius:var(--r-sm);height:40px;padding:0 18px;font-weight:650;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.gold-btn:hover{background:var(--gold2)}

/* Layout and sidebar */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 68px)}
.sidebar{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}
.nav-title{font-size:12px;font-weight:600;color:#6b7684;padding:8px 12px 6px}
.nav-item{width:100%;border:0;background:transparent;color:#a9b3c0;text-align:left;padding:0 12px;height:42px;border-radius:var(--r-sm);margin:2px 0;display:flex;align-items:center;gap:13px;font-size:14.5px;font-weight:500;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface);color:#fff}
.nav-item.active{background:var(--surface2);color:#fff}
.nav-item.active .nav-icon{color:var(--gold)}
.nav-icon{width:20px;height:20px;display:grid;place-items:center}
.sidebar-bottom{margin-top:28px;padding:18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.sidebar-bottom strong{font-family:var(--display);font-size:18px;font-weight:600}
.sidebar-bottom small{color:var(--muted);line-height:1.55;display:block;margin:8px 0 14px;font-size:13px}
.main{min-width:0;padding-bottom:120px}

/* Hero */
.hero{padding:56px 5% 44px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 85% 0%,rgba(216,169,78,.13),transparent 55%),var(--bg)}
.hero-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:40px;max-width:1240px;margin:auto;align-items:center}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,5.4vw,72px);line-height:1.02;letter-spacing:-.025em;margin:0 0 18px}
.hero p{max-width:560px;color:#a5afbc;font-size:17px;line-height:1.65;margin:0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-actions .gold-btn,.hero-actions .outline-btn{height:46px;padding:0 24px;font-size:15px}
.hero-card{border:1px solid var(--line2);background:linear-gradient(160deg,#1c2330,#131821);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:260px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.hero-card .live{display:flex;align-items:center;gap:9px;color:#ff9b96;font-weight:600;font-size:13px}
.dot{width:8px;height:8px;background:var(--danger);border-radius:50%;box-shadow:0 0 0 4px rgba(229,100,95,.16)}
.hero-card h3{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.15;margin:20px 0 8px}
.hero-card p{font-size:14px;color:var(--muted)}
.hero-card .gold-btn{width:100%}

/* Sections */
.section{padding:44px 5% 0;max-width:1400px;margin:auto}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.section-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:-.015em;line-height:1.15}
.section-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.view-all{color:var(--gold);font-weight:600;font-size:14px;white-space:nowrap}
.view-all:hover{color:var(--gold2)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-width:0;transition:border-color .18s,transform .18s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.cover{aspect-ratio:1.15/1;display:grid;place-items:center;position:relative;overflow:hidden;color:rgba(255,255,255,.88);background:linear-gradient(140deg,#3a3120,#171c24)}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.14),transparent 55%)}
.c0{background:linear-gradient(140deg,#4a3a1c,#191d25)}
.c1{background:linear-gradient(140deg,#1e4548,#151b23)}
.c2{background:linear-gradient(140deg,#452b48,#171a24)}
.c3{background:linear-gradient(140deg,#28405f,#151a24)}
.c4{background:linear-gradient(140deg,#2f4a2e,#151b1f)}
.c5{background:linear-gradient(140deg,#5a3323,#181b22)}
.cover-symbol,.church-icon{position:relative;opacity:.9}
.play-float{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#1a1305;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
.card:hover .play-float,.play-float:focus-visible{opacity:1;transform:none}
.card-body{padding:16px}
.card-title{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);color:#aab4c0;padding:4px 10px;border-radius:999px;font-size:12px;margin-top:12px}
.artist-card .cover{aspect-ratio:1.3/1}
.avatar{position:relative;width:88px;height:88px;border-radius:50%;background:rgba(12,15,20,.45);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--display);font-size:32px;font-weight:500;color:#fff}
.church-card .cover{aspect-ratio:1.5/1}

/* Track rows */
.row-list{display:grid;gap:8px}
.track{display:grid;grid-template-columns:36px 44px 1fr auto auto;align-items:center;gap:14px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);transition:background .15s,border-color .15s}
.track:hover{background:var(--surface2);border-color:var(--line2)}
.track-no{color:#6b7684;text-align:center;font-weight:600;font-size:14px}
.track-art{width:44px;height:44px;border-radius:var(--r-sm);background:linear-gradient(140deg,#4a3a1c,#1c222b);display:grid;place-items:center;color:rgba(255,255,255,.85)}
.track-info{min-width:0}
.track-info strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-info span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.track-stat{color:#7c8896;font-size:13px}
.play-mini{border:1px solid var(--line2);background:transparent;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .15s,color .15s}
.play-mini:hover{background:var(--gold);border-color:var(--gold);color:#1a1305}

/* Messages, video, live */
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.message{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:22px;margin-bottom:12px}
.message h3{margin:0 0 6px;font-family:var(--display);font-weight:500;font-size:22px}
.message p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 18px}
.split>div>.message:last-child,#messageList .message,#liveList .message{margin-bottom:0}
#messageList{gap:12px}
.video{aspect-ratio:16/9;border-radius:var(--r-md);border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,#4a3d26,#151a22 65%);display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer}
.video::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.6));pointer-events:none}
.card .video{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.video-play{position:relative;z-index:2;width:60px;height:60px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center;transition:transform .15s,background .15s}
.video-play:hover{transform:scale(1.06);background:var(--gold)}
.video-label{position:absolute;z-index:3;left:18px;bottom:15px;font-weight:650;font-size:15px}
.live-badge{position:absolute;z-index:3;right:14px;top:14px;background:var(--danger);color:#fff;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:650}
.message .video{margin-bottom:18px}

/* Footer */
.footer{margin:72px 5% 0;border-top:1px solid var(--line);padding:40px 0 20px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;color:var(--muted);max-width:1400px}
.footer h4{color:var(--text);margin:0 0 14px;font-size:14px;font-weight:650}
.footer p{font-size:14px;line-height:1.65;max-width:340px;margin:0 0 14px}
.footer a{display:block;margin:10px 0;font-size:14px;transition:color .15s}
.footer a:hover{color:#fff}
.footer span{font-size:13px}

/* Player */
.player{position:fixed;left:240px;right:0;bottom:0;height:80px;background:rgba(14,18,24,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:40;display:grid;grid-template-columns:300px 1fr 240px;align-items:center;padding:10px 24px;gap:20px}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now-art{width:52px;height:52px;border-radius:var(--r-sm);background:linear-gradient(140deg,#4a3a1c,#1c222b);display:grid;place-items:center;color:rgba(255,255,255,.88);flex:none}
.now-info{min-width:0}
.now-info strong,.now-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-info strong{font-size:14px;font-weight:650}
.now-info span{color:var(--muted);font-size:13px;margin-top:2px}
.controls{display:flex;align-items:center;justify-content:center;gap:16px}
.ctrl{background:transparent;border:0;color:#cfd6de;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;transition:color .15s}
.ctrl:hover{color:#fff}
.main-play{width:40px;height:40px;border-radius:50%;background:#fff;color:#111;border:0;display:grid;place-items:center;transition:transform .15s}
.main-play:hover{transform:scale(1.06)}
.progress{display:flex;align-items:center;gap:10px;color:#7c8896;font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:#2b3440;border-radius:4px;flex:1;overflow:hidden}
.bar i{display:block;width:38%;height:100%;background:var(--gold)}
.right-player{display:flex;align-items:center;gap:12px;justify-content:flex-end;color:#8a95a3}
.vol{width:84px;height:4px;background:#2b3440;border-radius:4px;overflow:hidden}
.vol i{display:block;width:65%;height:100%;background:#aab3be}
.mobile-menu{display:none}

/* Modal and toast */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,7,10,.75);backdrop-filter:blur(4px);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-lg);padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.modal h2{margin:0 0 10px;font-family:var(--display);font-weight:500;font-size:28px;line-height:1.15;padding-right:40px}
.modal p{color:var(--muted);line-height:1.65;margin:0 0 24px}
.close{float:right;border:0;background:var(--surface2);color:#fff;border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;transition:background .15s}
.close:hover{background:#2a3341}
.toast{position:fixed;right:24px;bottom:100px;background:#f1f3f6;color:#10141a;padding:12px 18px;border-radius:var(--r-sm);font-weight:600;font-size:14px;z-index:100;display:none;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.page{display:none}.page.active{display:block}
.empty{padding:48px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r-md);color:var(--muted)}

@media(max-width:1000px){
 .cards{grid-template-columns:repeat(3,1fr)}.hero-grid{grid-template-columns:1fr}
 .player{left:0;grid-template-columns:1fr auto}.right-player{display:none}.progress{display:none}
 .sidebar{position:fixed;left:-260px;top:68px;z-index:50;background:#0d1117;width:240px;transition:left .2s}.sidebar.open{left:0}
 .layout{grid-template-columns:1fr}.mobile-menu{display:inline-flex}.top-actions .outline-btn{display:none}
 .brand{width:auto}
}
@media(max-width:700px){
 .topbar{padding:0 14px;gap:10px}.brand{font-size:20px}.search{display:none}
 .cards{grid-template-columns:repeat(2,1fr);gap:14px}.split{grid-template-columns:1fr}
 .section{padding:32px 16px 0}.hero{padding:36px 16px 30px}.hero h1{font-size:42px}
 .footer{grid-template-columns:1fr 1fr;margin:56px 16px 0}.player{height:68px;padding:8px 14px}.now-art{width:44px;height:44px}
 .controls .ctrl{display:none}.track{grid-template-columns:28px 44px 1fr auto}.track-stat{display:none}
 .play-float{opacity:1;transform:none}.section-head h2{font-size:24px}
}
@media(max-width:430px){.footer{grid-template-columns:1fr}.top-actions .gold-btn{height:38px;padding:0 14px}.hero-actions .gold-btn,.hero-actions .outline-btn{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.player:not(.open){display:none}
.player{padding-right:60px}
.player-close{position:absolute;top:50%;right:14px;transform:translateY(-50%);border:1px solid var(--line2)}
.player-close:hover{background:var(--surface2)}
.main{padding-bottom:48px}body.has-player .main{padding-bottom:120px}
.toast{bottom:24px}body.has-player .toast{bottom:100px}
.bar,.vol{cursor:pointer;position:relative;overflow:visible}
.bar::before,.vol::before{content:"";position:absolute;inset:-9px 0}
.bar i,.vol i{border-radius:4px}
#saveBtn.on{color:var(--gold)}#saveBtn.on svg{fill:currentColor}
.video-play svg{width:24px;height:24px}
.notice{margin:24px 5% 0;padding:14px 18px;border:1px solid var(--line2);border-left:3px solid var(--danger);border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px}
.notice[hidden]{display:none}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:#c3ccd7}
.field input,.field select,.field textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 13px;font:inherit;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field input[type=file]{padding:9px}
.check{display:flex;gap:10px;align-items:flex-start;margin:4px 0 18px;font-size:14px;color:#c3ccd7;line-height:1.5}
.check input{margin-top:3px;accent-color:var(--gold)}
.form-error{color:#ff9b96;font-size:14px;min-height:0;margin-bottom:12px}.form-error:empty{display:none}
.gold-btn:disabled{opacity:.6;cursor:default}
.video-modal video{width:100%;border-radius:var(--r-md);background:#000;display:block}
@media(max-width:1000px){.player{padding-right:60px}}
@media(max-width:700px){.player-close{right:8px}}

.hero{padding:36px 5% 34px}
.hero-grid{display:block}
.hero-actions{margin-top:0}
.hero-live{max-width:1240px;margin:36px auto 0}
.hero-live .section-head h2{display:flex;align-items:center;gap:12px}
.pulse{position:relative;width:10px;height:10px;border-radius:50%;background:var(--danger);flex:none}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--danger);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.live-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.live-item{flex:0 0 min(320px,82%);scroll-snap-align:start;border:1px solid var(--line2);background:linear-gradient(160deg,#1c2330,#131821);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:220px;cursor:pointer;transition:border-color .18s}
.live-item:hover{border-color:#465364}
.live-tag{display:flex;align-items:center;gap:12px;color:#ff9b96;font-weight:600;font-size:13px}
.live-tag .views{margin-left:auto;color:var(--muted);font-weight:500}
.live-item h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.15;margin:16px 0 6px}
.live-item p{margin:0 0 18px;font-size:14px;color:var(--muted)}
.live-item .gold-btn{width:100%}
@media(prefers-reduced-motion:reduce){.pulse::after{animation:none}}

.footer{grid-template-columns:repeat(3,minmax(0,1fr))}
.footer-about,.footer-bottom{grid-column:1/-1}
.footer-about p{margin:0}
.footer-bottom{border-top:1px solid var(--line);padding-top:20px}
@media(max-width:700px){.footer{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 16px}}
@media(max-width:430px){.footer{grid-template-columns:repeat(3,minmax(0,1fr))}.footer a{font-size:13px}}

.seg{display:inline-flex;flex-wrap:nowrap;flex:none;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.seg-btn{border:0;background:transparent;color:var(--muted);height:34px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,color .15s}
.seg-btn:hover{color:#fff}
.seg-btn.active{background:var(--surface2);color:#fff}
@media(max-width:430px){.seg-btn{padding:0 12px;font-size:13px}}

.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.embed{position:relative;aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden;background:#000}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal:has(.embed),.modal:has(.video-modal){width:min(860px,100%)}


/* Player controls: skip, speed, equalizer */
.now{cursor:pointer}.now-art{position:relative;overflow:hidden}
.skipbtn{position:relative;width:38px;height:38px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ===== Offline engine: saves what you read, queues what you write, sends it when the internet is back ===== */
(function(){
'use strict';
var SB='https://ixmyndnerktftrgqopry.supabase.co',NF=window.fetch.bind(window),SBC=null,flushing=false,pend=0,flags={warming:false};
var WRITE_RPC={post_comment:1,delete_comment:1,reply_to_comment:1,mark_replies_read:1,send_support:1,mark_support_read:1,update_creator_profile:1,save_upload_defaults:1,toggle_like:1,set_like:1,set_follow:1};
var DROP_RPC={heartbeat:1,record_event:1};
var READ_RPC={watching_now:1,search_songs:1,chart_songs:1,creator_analytics:1,creator_content:1,creator_feedback:1,content_engagement:1,my_replies:1,creator_public:1,my_support:1,get_upload_defaults:1};
function uid(){try{return localStorage.getItem('ss-uid')||'anon'}catch(_){return'anon'}}
function slow(){var c=navigator.connection||{};return !!c.saveData||/^(slow-)?2g$/.test(c.effectiveType||'')}
function json(st,b){return new Response(st===204?null:b,{status:st,headers:{'content-type':'application/json'}})}

/* tiny IndexedDB helper */
var dbp=null;
function idb(){return dbp||(dbp=new Promise(function(res,rej){var r=indexedDB.open('ss-offline',1);r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('reads',{keyPath:'k'});d.createObjectStore('queue',{keyPath:'id',autoIncrement:true})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}))}
function rq(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function st(n,m){return (await idb()).transaction(n,m||'readonly').objectStore(n)}
var db={
 get:async function(n,k){return rq((await st(n)).get(k))},
 put:async function(n,v){return rq((await st(n,'readwrite')).put(v))},
 del:async function(n,k){return rq((await st(n,'readwrite')).delete(k))},
 all:async function(n){return rq((await st(n)).getAll())},
 range:async function(n,a,b){return rq((await st(n)).getAll(IDBKeyRange.bound(a,b)))},
 clear:async function(n){return rq((await st(n,'readwrite')).clear())}
};

/* which calls are reads, writes, or ignorable */
function classify(url,method){
 var u;try{u=new URL(url,location.href)}catch(_){return null}
 if(u.origin!==SB)return null;
 var p=u.pathname,m;
 if(p.indexOf('/rest/v1/rpc/')===0){
  var n=p.slice(13);
  if(DROP_RPC[n])return{t:'drop'};
  if(WRITE_RPC[n])return{t:'write',kind:'rpc',name:n,u:u};
  if(READ_RPC[n])return{t:'read',u:u,name:n};
  return null;
 }
 if(p.indexOf('/rest/v1/')===0){
  var table=p.slice(9);
  if(method==='GET')return{t:'read',u:u,table:table};
  if(method==='POST'||method==='PATCH'||method==='DELETE'||method==='PUT')return{t:'write',kind:'rest',table:table,u:u};
  return null;
 }
 m=p.match(/^\/storage\/v1\/object\/([^/]+)\/.+/);
 if(m&&(method==='POST'||method==='PUT')&&!/^(list|sign|public|move|copy|upload|authenticated|info)$/.test(m[1]))return{t:'write',kind:'storage',u:u};
 return null;
}

async function ssFetch(input,init){
 var url=typeof input==='string'?input:(input instanceof URL?input.href:input.url);
 var method=String((init&&init.method)||(typeof input!=='string'&&input.method)||'GET').toUpperCase();
 var c=classify(url,method);
 if(!c)return NF(input,init);
 if(c.t==='drop'){try{return await NF(input,init)}catch(_){return json(200,'null')}}
 if(c.t==='read')return doRead(input,init,url,method,c);
 return doWrite(input,init,url,method,c);
}

/* ---------- reads: network first, saved copy when offline or too slow ---------- */
function keyParts(u){
 var ps=[];u.searchParams.forEach(function(v,k){if(k!=='select')ps.push(k+'='+v)});ps.sort();
 return{base:uid()+'|'+u.pathname+'?'+ps.join('&'),sel:u.searchParams.get('select')||''};
}
function mk(rec){var h={'content-type':rec.ct||'application/json','x-ss-cache':'1'};if(rec.cr)h['content-range']=rec.cr;return new Response(rec.b,{status:200,headers:h})}
async function project(kp,accept){
 if(!kp.sel||kp.sel==='*'||/[():]/.test(kp.sel))return null;
 var cols=kp.sel.split(',').map(function(x){return x.trim()}),recs=[];
 try{recs=await db.range('reads',kp.base+'|',kp.base+'|\uffff')}catch(_){}
 for(var i=0;i<recs.length;i++){
  try{
   var d=JSON.parse(recs[i].b),rows=Array.isArray(d)?d:(d?[d]:[]);
   if(!rows.length)continue;
   if(!cols.every(function(c){return c in rows[0]}))continue;
   var out=rows.map(function(r){var o={};cols.forEach(function(c){o[c]=r[c]});return o});
   return{b:JSON.stringify(/object/.test(accept)?out[0]:out),ct:'application/json'};
  }catch(_){}
 }
 return null;
}
async function doRead(input,init,url,method,c){
 var h=new Headers((init&&init.headers)||undefined),accept=h.get('accept')||'';
 var body=(method==='POST'&&init&&typeof init.body==='string')?init.body:'';
 var kp=keyParts(c.u),key=kp.base+'|'+kp.sel+'|'+(/object/.test(accept)?'o':'a')+'|'+body;
 var cached=null;try{cached=await db.get('reads',key)}catch(_){}
 async function fallback(){return cached||(c.table?await project(kp,accept):null)}
 if(!navigator.onLine){var f0=await fallback();if(f0)return mk(f0)}
 var p=NF(input,init).then(async function(res){
  if(res.ok){try{var cl=res.clone(),txt=await cl.text();if(txt.length<2000000)await db.put('reads',{k:key,t:Date.now(),b:txt,ct:res.headers.get('content-type'),cr:res.headers.get('content-range')})}catch(_){}}
  return res;
 });
 if(cached){
  var r=await Promise.race([p.then(function(x){return{x:x}},function(e){return{e:e}}),new Promise(function(r){setTimeout(function(){r(null)},slow()?2500:6500)})]);
  if(r&&r.x&&(r.x.ok||r.x.status<500))return r.x;
  return mk(cached);
 }
 try{return await p}catch(e){var f=await fallback();if(f)return mk(f);throw e}
}

/* ---------- writes: send now, or keep on the device and send later ---------- */
async function recount(){try{var q=await db.all('queue'),me=uid();pend=q.filter(function(i){return i.uid===me}).length}catch(_){pend=0}return pend}
async function doWrite(input,init,url,method,c){
 var me=uid();
 if(me==='anon')return NF(input,init);
 var n=await recount();
 if(navigator.onLine&&n===0){try{return await NF(input,init)}catch(e){if(!(e instanceof TypeError))throw e}}
 return enqueue(input,init,url,method,c,me);
}
async function enqueue(input,init,url,method,c,me){
 var h=new Headers((init&&init.headers)||(typeof input!=='string'&&input.headers)||undefined),hd={};
 h.forEach(function(v,k){hd[k]=v});
 var b=init&&init.body,text=null,blob=null;
 if(typeof b==='string')text=b;
 else if(b!=null){var r=new Response(b);blob=await r.blob();if(typeof FormData!=='undefined'&&b instanceof FormData)hd['content-type']=r.headers.get('content-type')}
 delete hd['content-length'];
 var item={uid:me,url:url,method:method,headers:hd,text:text,blob:blob,t:Date.now(),kind:c.kind,table:c.table||null,name:c.name||null,tmp:Date.now().toString(36)+Math.random().toString(36).slice(2,6),needs:null,path:null};
 var parsed=null;try{parsed=text?JSON.parse(text):null}catch(_){}
 if(c.kind==='rest'&&c.table==='content'&&method==='POST'&&parsed){var row=[].concat(parsed)[0];if(row&&row.storage_path)item.needs=row.storage_path}
 if(c.kind==='storage')item.path=decodeURIComponent(c.u.pathname.replace(/^\/storage\/v1\/object\/[^/]+\//,''));
 await db.put('queue',item);
 await recount();
 try{await overlay(item,parsed)}catch(_){}
 paint();
 return synth(item,parsed,hd);
}
function synth(item,parsed,hd){
 var obj=/object/.test(hd.accept||''),rep=/return=representation/.test(hd.prefer||'');
 if(item.kind==='storage'){var m=item.url.match(/\/object\/([^/]+)\/(.+)$/);return json(200,JSON.stringify({Id:'offline-'+item.tmp,Key:m?decodeURIComponent(m[1]+'/'+m[2]):''}))}
 if(item.kind==='rpc')return json(200,'null');
 var id=(new URL(item.url).searchParams.get('id')||'').replace(/^eq\./,'');
 if(item.method==='POST'){
  if(!rep)return json(201,'');
  var rows=[].concat(parsed||{}).map(function(r){return Object.assign({id:'offline-'+item.tmp},r)});
  return json(201,JSON.stringify(obj?rows[0]:rows));
 }
 if(!rep)return json(204);
 var r=id?[{id:id}]:[{}];return json(200,JSON.stringify(obj?r[0]:r));
}

/* make the screens show the waiting change straight away */
async function patchReads(prefix,fn){
 var rows=await db.range('reads',prefix,prefix+'\uffff');
 for(var i=0;i<rows.length;i++){try{var o=fn(JSON.parse(rows[i].b));if(o!==undefined){rows[i].b=JSON.stringify(o);await db.put('reads',rows[i])}}catch(_){}}
}
async function overlay(it,p){
 var me=it.uid,pre=function(n){return me+'|/rest/v1/rpc/'+n+'?'};
 var id=(new URL(it.url).searchParams.get('id')||'').replace(/^eq\./,'');
 if(it.kind==='rest'&&it.table==='content'){
  await patchReads(pre('creator_content'),function(list){
   if(!Array.isArray(list))return;
   if(it.method==='POST')[].concat(p||[]).forEach(function(r){list.unshift({id:'offline-'+it.tmp,title:r.title,type:r.category||(r.kind?r.kind.charAt(0).toUpperCase()+r.kind.slice(1):'Content'),status:'Waiting to send',plays:0,views:0,likes:0,watching:0,growth:0})});
   else if(it.method==='PATCH'&&id)list.forEach(function(x){if(String(x.id)===id&&p&&p.title!=null)x.title=p.title});
   else if(it.method==='DELETE'&&id)list=list.filter(function(x){return String(x.id)!==id});
   return list;
  });
 }
 if(it.kind==='rpc'&&it.name==='reply_to_comment'&&p){
  await patchReads(pre('creator_feedback'),function(d){if(d&&Array.isArray(d.recent)){d.recent=d.recent.filter(function(x){return String(x.id)!==String(p.p_comment)});return d}});
 }
 if(it.kind==='rpc'&&it.name==='update_creator_profile'&&p){
  await patchReads(me+'|/rest/v1/creators?',function(d){var f=function(r){if(r){if(p.p_name)r.name=p.p_name;if(p.p_location!=null)r.location=p.p_location;if(p.p_description!=null)r.description=p.p_description}};Array.isArray(d)?d.forEach(f):f(d);return d});
 }
}

/* ---------- send everything that is waiting ---------- */
async function token(){try{if(!SBC)return null;var r=await SBC.auth.getSession();return r&&r.data&&r.data.session?r.data.session.access_token:null}catch(_){return null}}
async function flush(){
 if(flushing||!navigator.onLine)return;
 flushing=true;var sent=0,failed=0,me=uid(),bad={},retried=false;
 try{
  var items=(await db.all('queue')).sort(function(a,b){return a.id-b.id});
  for(var i=0;i<items.length;i++){
   var it=items[i];
   if(it.uid!==me)continue;
   if(it.needs&&bad[it.needs]){await db.del('queue',it.id);failed++;continue}
   var hd=Object.assign({},it.headers),tok=await token();
   if(tok)hd.authorization='Bearer '+tok;
   var res;
   try{res=await NF(it.url,{method:it.method,headers:hd,body:it.text!=null?it.text:(it.blob||undefined)})}catch(e){break}
   if(res.ok){await db.del('queue',it.id);sent++;continue}

function curTheme(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark'}

function toggleTheme(){var r=document.documentElement,t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem('ss-theme',t)}catch(_){}var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f5f6f8':'#0c0f14';if(typeof toast==='function')toast(t==='light'?'Day mode':'Night mode')}
const ago=d=>{const t=Math.max(0,(Date.now()-new Date(d))/1000);return t<60?'just now':t<3600?Math.floor(t/60)+' min ago':t<86400?Math.floor(t/3600)+' h ago':t<2592000?Math.floor(t/86400)+' d ago':new Date(d).toLocaleDateString()};
const STOP=new Set('this that with have from your they them were will what when which there their about would could been more very just also than then thank into some like love'.split(' ').concat('the and for you are was but not all can our out has had his her she him its who how why yes too one two'.split(' ')));
function topWords(list){const m={};list.forEach(c=>String(c.body||'').toLowerCase().replace(/[^a-z\u00c0-\u024f'\s]/g,' ').split(/\s+/).forEach(w=>{if(w.length>=4&&!STOP.has(w))m[w]=(m[w]||0)+1}));return Object.entries(m).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,8)}

function engagementCards(PC){
 const rate=c=>{const b=(c.views||0)+(c.plays||0);return b?Math.round(((c.likes||0)+(PC[c.id]||0))/b*1000)/10:0};
 const ranked=[...cContent].map(c=>({c,n:(c.likes||0)+(PC[c.id]||0),r:rate(c)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,20),mx=ranked[0]?ranked[0].n:1;
 const eng=`<div class="c-card"><h3>Engagement by content</h3>${ranked.length?'<div class="c-scroll">'+ranked.map(x=>`<div class="c-row"><div class="c-t"><strong>${e(x.c.title)}</strong><i class="meter"><b style="width:${Math.round(x.n/mx*100)}%"></b></i><span>${fmtN(x.c.likes||0)} likes · ${fmtN(PC[x.c.id]||0)} comments</span></div><span>${x.r}%</span></div>`).join('')+'</div>':'<p class="c-empty">Likes and comments will show here once people react to your content.</p>'}</div>`;
 let say;
 if(!cFeed)say='<p class="c-empty">Comments will appear here once comments are switched on for the site.</p>';
 else{const rc=cFeed.recent||[],tw=topWords(rc);
  say=(tw.length?`<div class="words">${tw.map(w=>`<span>${e(w[0])} <b>${w[1]}</b></span>`).join('')}</div>`:'')+(rc.length?'<div class="c-scroll">'+rc.map(c=>`<div class="eng-item"><div class="eng-av">${e((c.author_name||'L')[0].toUpperCase())}</div><div class="eng-body"><div class="eng-meta"><strong>${e(c.author_name)}</strong><span>on ${e(c.title)} · ${ago(c.created_at)}</span><button type="button" class="eng-reply" onclick="replyOpen('${e(c.id)}')">Reply</button></div><p>${e(c.body)}</p><div class="rp-box" id="rp-${e(c.id)}" hidden><textarea maxlength="500" rows="2" placeholder="Write a private reply…"></textarea><div class="rp-note">Only this viewer will see your reply, and this comment will leave your list.</div><div class="rp-actions"><button type="button" class="gold-btn" onclick="replySend('${e(c.id)}')">Send reply</button><button type="button" class="outline-btn" onclick="replyOpen('${e(c.id)}')">Cancel</button></div></div></div></div>`).join('')+'</div>':'<p class="c-empty">Nothing waiting for a reply. New comments from listeners appear here.</p>')}
 return `<div class="c-split">${eng}<div class="c-card"><h3>What viewers are saying</h3>${say}</div></div>`;
}

function presetBlob(n,video,W,H){return new Promise(res=>{
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),[a,b]=ART_COLORS[n];

 const rg=x.createRadialGradient(W*.28,H*.16,0,W*.28,H*.16,Math.max(W,H)*.6);rg.addColorStop(0,'rgba(255,255,255,.22)');rg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);

 if(video)drawPlayBadge(x,cx,cy,r);
 else{
  const gg=x.createLinearGradient(cx-r,cy-r,cx+r,cy+r);gg.addColorStop(0,'#f3d58a');gg.addColorStop(1,'#d4a64a');
  x.save();x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=r*.5;x.shadowOffsetY=r*.15;x.fillStyle=gg;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();x.restore();
  const k=r*1.1/24;x.save();x.translate(cx-12*k,cy-12*k);x.scale(k,k);x.strokeStyle='#1a1305';x.lineWidth=2;x.lineCap='round';x.lineJoin='round';
  x.stroke(new Path2D('M9 18V5l11-2v13'));x.beginPath();x.arc(6,18,3,0,Math.PI*2);x.stroke();x.beginPath();x.arc(17,16,3,0,Math.PI*2);x.stroke();x.restore()}
 c.toBlob(b=>res(b),'image/jpeg',.88)})}

function wideBlob(file,W){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);let sw=im.width,sh=sw*9/16;if(sh>im.height){sh=im.height;sw=sh*16/9}const c=document.createElement('canvas');c.width=Math.min(W,Math.round(sw));c.height=Math.round(c.width*9/16);c.getContext('2d').drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Could not read that image.')),'image/jpeg',.88)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That image could not be read. Use a JPG, PNG or WebP file.'))};im.src=u})}

 return `<div class="dash-head"><div class="dash-top"><div class="dash-id">${av(creator.avatar_url,creator.name,'lg')}<div class="dash-info"><h2>${e(creator.name)}</h2><p>${e(kindOf())}${creator.location?', '+e(creator.location):''}</p><span class="badge">${creator.verified?'Verified':'Awaiting verification'}</span>${creator.description?`<p class="dash-about">${e(creator.description)}</p>`:''}</div></div></div>${actions?`<div class="btn-row dash-actions"><button class="gold-btn" onclick="setTab('post')">Upload content</button><button class="outline-btn" onclick="openPost('video','link')">Add stream or video link</button><button class="outline-btn" onclick="editProfile()">Edit profile</button></div>`:''}</div>`;
}
function todo(){
 const p=nPending(),it=[];
 if(p)it.push(tile('<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-6A8 8 0 1 1 21 12z"/>',p+' comment'+(p>1?'s':'')+' waiting for a reply','Open Audience to reply privately',"setTab('audience')"));
 if(!cContent.length)it.push(tile('<path d="M12 5v14M5 12h14"/>','Publish your first item','Upload a song, message or video',"setTab('post')"));
 if(!creator.avatar_url||!creator.description)it.push(tile('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>','Complete your profile','Add a picture and a short description',"editProfile()"));
 return it.length?`<div class="cs-tiles">${it.join('')}</div>`:'';
}
function vOverview(){
 return head()+(creator.verified?'':card('Your profile is awaiting verification','<p class="c-empty">Our team checks every new creator. Once verified, you appear in Artists &amp; Ministries and people can follow you. Everything you publish goes live right away.</p>'))+todo()+perBar()+stats()+card(`Performance <span class="seg" style="float:right" role="group" aria-label="Metric">${seg(MET,cMetric,'setCMetric')}</span>`,lineChart(cMetric))+lists();
}
function rows(){
 const q=cQ.toLowerCase(),PC=(cFeed&&cFeed.per_content)||{};
 const L=cContent.filter(c=>(cType==='all'||c.type===cType)&&(!q||String(c.title).toLowerCase().includes(q))).sort((a,b)=>cSort==='title'?String(a.title).localeCompare(b.title):(b[cSort]||0)-(a[cSort]||0));
 return L.length?L.map(c=>`<div class="cs-item"><div class="ci-top"><div><h4>${e(c.title)}</h4><div class="m"><span>${e(c.type)}</span><span>${e(c.status)}</span>${PC[c.id]?`<span>${fmtN(PC[c.id])} comment${PC[c.id]==1?'':'s'}</span>`:''}</div></div>${String(c.id).startsWith('offline-')?'':`<button type="button" class="kebab-btn" aria-label="More options for ${e(c.title)}" aria-haspopup="menu" aria-expanded="false" onclick="openKebab('${e(c.id)}',this)">${ic(DOTS_V,20)}</button>`}</div><div class="m"><span>${fmtN(c.plays)} plays</span><span>${fmtN(c.views)} views</span><span>${fmtN(c.likes||0)} likes</span><span>${fmtN(c.watching||0)} watching</span>${pct(c.growth||0)}</div>${String(c.id).startsWith('offline-')?'<div class="a"><span class="m pend">Waiting to send. It goes out automatically when you are online.</span></div>':''}</div>`).join(''):'<p class="c-empty">No content matches.</p>';
}
function vContent(){
 const types=[...new Set(cContent.map(c=>c.type))],R="$('clist').innerHTML=rows()";
 return title('Content',cContent.length+' item'+(cContent.length==1?'':'s')+' published')+`<div class="cs-tools"><input type="search" placeholder="Search your content" aria-label="Search" value="${e(cQ)}" oninput="cQ=this.value;${R}"><select aria-label="Type" onchange="cType=this.value;${R}"><option value="all">All types</option>${types.map(t=>`<option${t===cType?' selected':''}>${e(t)}</option>`).join('')}</select><select aria-label="Sort" onchange="cSort=this.value;${R}">${[['plays','Most played'],['views','Most viewed'],['likes','Most liked'],['growth','Fastest growing'],['title','A to Z']].map(([k,l])=>`<option value="${k}"${k===cSort?' selected':''}>${l}</option>`).join('')}</select><button class="outline-btn" onclick="exportCSV('content')">Export CSV</button><button class="gold-btn" onclick="setTab('post')">Upload</button></div>`+card('All content',`<div id="clist">${rows()}</div>`);
}
function vPost(){
 const rec=cContent.slice(0,6);
 return title('Post','Publish new content and share streams with your audience.')+`<div class="cs-tiles">${tile(NOTE,'Post audio','Songs, albums and hymns from an audio file',"openPost('music')")}${tile('<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 11a7 7 0 0 1-14 0M12 18v4"/>','Post a message','Sermons, teachings and testimonies',"openPost('message')")}${tile('<rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2"/>','Post a video','A video file or a video link',"openPost('video')")}${tile('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>','Post a live stream','Link only: YouTube, Facebook, Twitch and more',"openPost('live')")}</div><div class="cs-grid2">${card('Before you publish',kv('Rights','Only publish what you own or have permission to share.')+kv('Goes live','Everything you publish is visible right away.')+kv('Covers','Add a cover so your content stands out. You can change it later.'))}${card('In your library',rec.length?rec.map(c=>`<div class="c-row"><div class="c-t"><strong>${e(c.title)}</strong><span>${e(c.type)}</span></div><span>${fmtN(c.plays)} plays</span></div>`).join(''):'<p class="c-empty">Nothing published yet.</p>')}</div>`;
}
function vAudience(){
 const T=(cData&&cData.totals)||{},C=(cData&&cData.changes)||{};
 return title('Audience','Your followers and what they say.')+perBar()+`<div class="stats"><div class="stat"><span>Followers</span><strong>${fmtN(T.followers||0)}</strong>${C.followers==null?'':pct(C.followers)}</div><div class="stat"><span>Likes</span><strong>${fmtN(T.likes||0)}</strong></div><div class="stat"><span>Comments</span><strong>${cFeed?fmtN(cFeed.comments):'–'}</strong></div><div class="stat"><span>Awaiting reply</span><strong>${nPending()}</strong></div></div>`+engagementCards((cFeed&&cFeed.per_content)||{});
}
function vAnalytics(){
 const s=((cData&&cData.series)||[]).slice(-14).reverse();
 return title('Analytics','See how your content performs over time.')+perBar()+stats()+`<div class="cs-grid2">${MET.map(([k,l])=>card(l,lineChart(k))).join('')}</div><div style="height:16px"></div>`+card('Daily breakdown <button class="outline-btn" style="float:right;height:34px" onclick="exportCSV(\'daily\')">Export CSV</button>',s.length?`<div class="c-scroll"><table class="cs-days"><tr><th>Date</th><th>Views</th><th>Plays</th><th>Likes</th><th>New followers</th></tr>${s.map(x=>`<tr><td>${e(x.date)}</td><td>${fmtN(x.views||0)}</td><td>${fmtN(x.plays||0)}</td><td>${fmtN(x.likes||0)}</td><td>${fmtN(x.followers||0)}</td></tr>`).join('')}</table></div>`:'<p class="c-empty">No data yet.</p>')+lists();
}
function vProfile(){
 return title('Profile','How listeners see you on ShalomStream.')+head(true)+`<div class="cs-grid2">${card('Profile details',kv('Name',e(creator.name))+kv('Type',e(kindOf()))+kv('Location',e(creator.location))+kv('About',e(creator.description))+kv('Status',creator.verified?'Verified':'Awaiting verification'))}${card('Account and sharing',kv('Sign-in email',e(user&&user.email))+kv('Public page',`<a class="lnk" href="${e(pubUrl())}" target="_blank" rel="noopener">${e(pubUrl())}</a>`)+`<div class="btn-row" style="margin-top:14px"><button class="gold-btn" onclick="editProfile()">Edit profile</button><button class="outline-btn" onclick="copyPub()">Copy link</button><button class="outline-btn" onclick="sharePub()">Share</button></div>`)}</div>`;
}
function vSettings(){
 return title('Settings','Appearance, security and help.')+`<div class="cs-grid2">${lookCard()}${offlineCard()}${card('Appearance','<div class="seg" role="group" aria-label="Theme"><button type="button" class="seg-btn" data-th="light" onclick="setThemeMode(\'light\')">Day</button><button type="button" class="seg-btn" data-th="dark" onclick="setThemeMode(\'dark\')">Night</button></div>')}${card('Change password','<form class="au-form" onsubmit="newPw(event)"><div class="au-field"><label>New password</label><input type="password" name="pw" minlength="6" maxlength="72" required autocomplete="new-password"></div><div class="form-error" id="pwErr" role="alert"></div><button class="gold-btn" type="submit">Update password</button></form>')}${card('Help','<p class="c-empty">Send a complaint, question or appeal to the admin and read their replies here.</p><div class="btn-row"><button class="gold-btn" onclick="openSupport()">Contact admin</button></div>')}${card('Session','<div class="btn-row"><button class="outline-btn" onclick="refreshCreator().then(()=>toast(\'Data refreshed\'))">Refresh data</button><button class="outline-btn" onclick="signOut()">Sign out</button></div>')}</div>`;
}
const VIEWS={overview:vOverview,content:vContent,post:vPost,audience:vAudience,analytics:vAnalytics,profile:vProfile,settings:vSettings};
function setTab(t){tab=t;try{localStorage.setItem('ss-tab',t)}catch(_){}closeMore();renderCreator();window.scrollTo(0,0)}
function topbar(){return `<header class="cs-top"><span class="cs-brand">Shalom<b>Stream</b> <em>Studio</em></span><span class="cs-sp"></span><button class="cs-ib" onclick="toggleTheme()" aria-label="Switch day or night mode" title="Day / Night mode">◐</button>${creator?`<button class="cs-ib" onclick="setTab('profile')" aria-label="My profile">${av(creator.avatar_url,creator.name,'')}</button>`:''}</header>`}
function renderCreator(){
 const root=$('creatorRoot');if(!root)return;
 if(cLoading){root.innerHTML=topbar()+'<div class="empty">Loading…</div>';return}
 if(!creator){root.innerHTML=topbar()+'<div class="section" style="padding-top:35px">'+signupHtml()+'</div>';bindSignup();rememberFill();return}
 root.innerHTML=topbar()+`<div class="cs-layout"><nav class="cs-nav" aria-label="Studio">${TABS.map(([k,l,p])=>`<button class="${k===tab?'on':''}${PRI.includes(k)?'':' sec'}${k==='post'?' post-btn':''}"${k==='post'?' aria-label="Post new content"':''} onclick="setTab('${k}')">${ic(p,20)}<span>${l}</span>${k==='audience'&&nPending()?`<i class="n">${nPending()}</i>`:''}</button>`).join('')}${moreBtn()}</nav><main class="cs-body">${VIEWS[tab]()}</main></div>`;
 try{paintThemeSeg()}catch(_){}
 try{ssOffline.paint()}catch(_){}
}
function saveCSV(name,rows){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',b=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCSV(w){
 if(w==='content')saveCSV('content.csv',[['Title','Type','Status','Plays','Views','Likes','Watching','Growth %']].concat(cContent.map(c=>[c.title,c.type,c.status,c.plays,c.views,c.likes||0,c.watching||0,c.growth||0])));
 else saveCSV('daily-'+cPeriod+'.csv',[['Date','Views','Plays','Likes','New followers']].concat(((cData&&cData.series)||[]).map(s=>[s.date,s.views||0,s.plays||0,s.likes||0,s.followers||0])));
}
function copyPub(){try{navigator.clipboard.writeText(pubUrl()).then(()=>toast('Profile link copied'),()=>toast('Could not copy the link'))}catch(_){toast('Could not copy the link')}}
async function shareItem(id){const c=(cContent||[]).find(x=>String(x.id)===String(id)),u=contentUrl(id);try{if(navigator.share){await navigator.share({title:((c&&c.title)||'Content')+' on ShalomStream',text:((c&&c.title)||'Content')+' · Content from Shalom Stream',url:u});return}await navigator.clipboard.writeText(u);toast('Link copied')}catch(_){}}
async function sharePub(){try{if(navigator.share){await navigator.share({title:creator.name+' on ShalomStream',text:creator.name+' · Creator on Shalom Stream',url:pubUrl()});return}}catch(_){return}copyPub()}
async function newPw(ev){ev.preventDefault();const f=ev.target;try{const r=await sb.auth.updateUser({password:f.pw.value});if(r.error)throw r.error;f.reset();toast('Password updated')}catch(er){$('pwErr').textContent=er.message||'Could not update the password.'}}
async function editItem(id){
 const r=await sb.from('content').select('title,description').eq('id',id).maybeSingle(),c=r.data||{};
 showModal(`<h2>Edit details</h2><form id="iform" class="au-form"><div class="au-field"><label>Title</label><input name="title" maxlength="120" required value="${e(c.title||'')}"></div><div class="au-field"><label>Description</label><textarea name="description" rows="4" maxlength="2000" class="au-area">${e(c.description||'')}</textarea></div><div class="form-error" id="ierr" role="alert"></div><button class="gold-btn au-submit" type="submit">Save</button></form>`);
 $('iform').onsubmit=async ev=>{ev.preventDefault();const f=ev.target,u=await sb.from('content').update({title:f.title.value.trim(),description:f.description.value.trim()}).eq('id',id).eq('creator_id',creator.id).select('id');if(u.error||!u.data||!u.data.length){$('ierr').textContent='This could not be saved. Ask the admin to allow creators to edit their own content.';return}closeModal();toast('Saved');refreshCreator()};
}
function delItem(id){const c=cContent.find(x=>String(x.id)===String(id));showModal(`<h2>Delete this item?</h2><p>“${e(c?c.title:'This item')}” will be removed from ShalomStream. This cannot be undone.</p><div class="form-error" id="derr" role="alert"></div><div class="btn-row"><button class="gold-btn" onclick="delGo('${e(id)}')">Delete</button><button class="outline-btn" onclick="closeModal()">Cancel</button></div>`)}
async function delGo(id){const r=await sb.from('content').delete().eq('id',id).eq('creator_id',creator.id).select('id');if(r.error||!r.data||!r.data.length){$('derr').textContent='This could not be deleted. Ask the admin to allow creators to delete their own content.';return}closeModal();toast('Deleted');refreshCreator()}
function setUser(u){user=u;if(!u){creator=null;cData=null;cFeed=null;cContent=[];tab='overview'}renderCreator()}
async function signOut(){try{await api.post('/auth/logout');setUser(null);toast('Signed out')}catch(err){toast(err.message)}}
function loadAll(){}
function authClick(){const n=window.ssOffline?window.ssOffline.pending():0;if(n&&!confirm(n+' saved change'+(n>1?'s have':' has')+' not been sent yet. They stay on this device and send the next time you sign in. Sign out anyway?'))return;signOut()}
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&user)setUser(null)});
(async()=>{await rememberGuard();try{const me=await api.get('/auth/me');if(me&&me.user)user=me.user}catch(_){}await loadCreator();warmOffline()})();
setInterval(()=>{const a=document.activeElement,m=$('modalBackdrop');if(creator&&!document.hidden&&m.style.display!=='flex'&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))refreshCreator()},45000);


/* ===== Studio look: colour, layout, borders ===== */
const LOOK={accent:'gold',layout:'side',border:'soft'};
try{Object.assign(LOOK,JSON.parse(localStorage.getItem('ss-look')||'{}'))}catch(_){}
function paintLook(){const r=document.documentElement;r.dataset.accent=LOOK.accent;r.dataset.layout=LOOK.layout==='side'?'':LOOK.layout;r.dataset.border=LOOK.border}
function setLook(k,v){LOOK[k]=v;try{localStorage.setItem('ss-look',JSON.stringify(LOOK))}catch(_){}paintLook();renderCreator()}
function lookCard(){
 const AC=[['gold','#d9a62e','Gold'],['emerald','#2fb67c','Emerald'],['royal','#5b8def','Royal blue'],['rose','#e0607e','Rose'],['violet','#9b7bf0','Violet'],['ember','#f08a3c','Ember']];
 const sg=(k,l)=>`<div class="cs-pref"><label>${k[1]}</label><div class="seg" role="group">${l.map(([v,n])=>`<button type="button" class="seg-btn${LOOK[k[0]]===v?' active':''}" onclick="setLook('${k[0]}','${v}')">${n}</button>`).join('')}</div></div>`;
 return card('Colours, layout and borders',`<label class="cs-sub" style="margin:0 0 8px;display:block">Accent colour</label><div class="cs-sw">${AC.map(([v,c,n])=>`<button type="button" style="--c:${c}" class="${LOOK.accent===v?'on':''}" title="${n}" aria-label="${n}" onclick="setLook('accent','${v}')"></button>`).join('')}</div>`+sg(['layout','Layout'],[['side','Sidebar'],['top','Top tabs'],['rail','Icon rail'],['cards','Big cards']])+sg(['border','Borders'],[['soft','Soft'],['bold','Bold'],['accent','Accent'],['none','None']]));
}
paintLook();

/* ===== Remember login ===== */
function rememberSet(on,email){try{localStorage.setItem('ss-remember',on?'1':'0');if(on)localStorage.setItem('ss-email',String(email||'').trim());else localStorage.removeItem('ss-email');sessionStorage.setItem('ss-alive','1')}catch(_){}}
async function rememberGuard(){
 try{if(localStorage.getItem('ss-remember')==='0'&&!sessionStorage.getItem('ss-alive')&&sb)await sb.auth.signOut({scope:'local'});sessionStorage.setItem('ss-alive','1')}catch(_){}
}
function rememberFill(){try{const f=$('lform'),m=localStorage.getItem('ss-email');if(f&&m&&f.email&&!f.email.value)f.email.value=m}catch(_){}}
</script>
<div id="pwaGate" role="dialog" aria-modal="true" aria-labelledby="pwaTitle"><img src="logo.png" alt="ShalomStream logo"><h1 id="pwaTitle">Shalom<span>Stream</span> Studio</h1><p>Install the app to open it straight from your home screen.</p><button id="pwaInstall" type="button">Install app</button><button id="pwaSkip" type="button">Continue in browser</button><div id="pwaHint" role="status"></div></div>
<script>
(function(){
 var gate=document.getElementById('pwaGate'),hint=document.getElementById('pwaHint'),dp=null;
 var standalone=function(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true};
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 function show(){gate.classList.add('show');document.documentElement.style.overflow='hidden'}
 function hide(){gate.classList.remove('show');document.documentElement.style.overflow=''}
 function note(t){hint.textContent=t;hint.style.display='block'}
 var skipped=false;try{skipped=sessionStorage.getItem('ss-pwa-skip')==='1'}catch(_){}
 if(!standalone()&&!skipped)show();
 addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
 addEventListener('appinstalled',function(){dp=null;hide();try{toast('Installed. Find ShalomStream Studio on your home screen.')}catch(_){}});
 document.getElementById('pwaSkip').onclick=function(){try{sessionStorage.setItem('ss-pwa-skip','1')}catch(_){}hide()};
 document.getElementById('pwaInstall').onclick=function(){
  if(dp){var p=dp;dp=null;p.prompt();p.userChoice.then(function(r){if(r.outcome==='accepted'){note('Installing in the background. Look for the app on your home screen.');setTimeout(hide,2500)}else note('Installation was cancelled. Tap Install app to try again.')});return}
  if(ios)note('On iPhone or iPad: tap the Share button in Safari, then choose Add to Home Screen.');
  else note('Open your browser menu and choose Install app (or Add to Home screen). If it is already installed, open it from your home screen.');
 };
 window.installApp=function(){try{sessionStorage.removeItem('ss-pwa-skip')}catch(_){}hint.style.display='none';show()};
 window.__pwaCanAsk=function(){return !standalone()};
 if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
